[tool.poetry]
name = "trackyourfunds-backend"
version = "0.1.0"
description = "Business finance tracking backend for multi-currency and tax calculations"
authors = ["Ajani Hinds "]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.116.0"
uvicorn = {extras=["standard"], version = "^0.24.0"}
SQLAlchemy = "^2.0.0"
psycopg[binary] = "^3.2.0"
pydantic = "^2.6.0"
python-dotenv = "^1.0.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
httpx = "^0.30.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
